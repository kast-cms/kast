# Full-stack Docker deployment (Postgres + Redis + API + Admin).
# Copy .env.example to .env before running. The API service overrides the
# host-only DATABASE_URL and REDIS_HOST values from .env so `docker compose up`
# works without manually changing local development settings.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kast_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kast_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-kast} -d $${POSTGRES_DB:-kast_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kast}:${POSTGRES_PASSWORD:-kast_secret}@postgres:5432/${POSTGRES_DB:-kast_db}
      REDIS_HOST: redis
      STORAGE_LOCAL_DIR: /tmp/kast-uploads
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/tmp/kast-uploads

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      INTERNAL_API_URL: http://api:3000
    ports:
      - '3001:3001'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  uploads:
