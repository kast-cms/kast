# Full-stack Docker deployment (Postgres + Redis + API).
# Copy .env.example to .env, fill in your values, then `docker compose up`.
# The API is pointed at the compose service names automatically — see the
# `environment` block on the api service.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kast
      POSTGRES_PASSWORD: kast_secret
      POSTGRES_DB: kast_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kast -d kast_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    # `environment` takes precedence over `env_file`. Inside the compose network
    # Postgres and Redis are reached by service name; a .env copied from
    # .env.example points at localhost, which inside this container is the
    # container itself, so the API would crash-loop on startup. Set
    # DOCKER_DATABASE_URL / DOCKER_REDIS_HOST to use servers outside compose.
    environment:
      # This is a deployment, so it is production regardless of what NODE_ENV a
      # copied .env happens to carry — env_file must not be able to downgrade it.
      # KAST_DOCKER_NODE_ENV=development opts a throwaway local stack back out.
      NODE_ENV: ${KAST_DOCKER_NODE_ENV:-production}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://kast:kast_secret@postgres:5432/kast_db}
      REDIS_HOST: ${DOCKER_REDIS_HOST:-redis}
      REDIS_PORT: ${DOCKER_REDIS_PORT:-6379}
    # Apply migrations before serving, so `docker compose up` on a fresh volume
    # yields a working API rather than one querying tables that do not exist.
    command: sh -c "node_modules/.bin/prisma migrate deploy && node dist/main.js"
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/tmp/kast-uploads

volumes:
  postgres_data:
  redis_data:
  uploads:
