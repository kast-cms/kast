packages:
  - 'apps/*'
  - 'packages/*'
  - 'plugins/*'

catalog:
  typescript: ^5.5.0

# Mirrored from package.json "pnpm". Newer pnpm reads settings only from here;
# pnpm 9 still reads package.json, so both must carry the same values until the
# repo pins a pnpm that no longer needs the package.json copy.
overrides:
  'body-parser': '^2.3.0'
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@>=4': '^5.0.9'
  'dompurify': '^3.4.13'
  'esbuild': '^0.28.1'
  'fast-uri': '^3.1.5'
  'fast-xml-builder': '^1.1.7'
  'form-data': '^4.0.6'
  'icu-minify': '^4.9.2'
  'js-yaml@3': '^3.15.1'
  'js-yaml@4': '^4.3.1'
  'lodash': '^4.18.1'
  'multer': '^2.2.0'
  'nanoid': '^3.3.17'
  'next-intl': '^4.9.2'
  'nodemailer': '^9.0.1'
  'postcss': '^8.5.18'
  'qs': '^6.15.2'
  'sharp': '^0.35.0'
  'svgo': '^4.0.2'
  'undici': '^7.29.0'
  'uuid': '^11.1.1'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - 'argon2'
  - 'esbuild'
  - 'msgpackr-extract'
  - 'prisma'
  - 'sharp'
