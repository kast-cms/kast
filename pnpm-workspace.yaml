packages:
  - 'apps/*'
  - 'packages/*'
  - 'plugins/*'

catalog:
  typescript: ^5.5.0

# The pinned runner (packageManager: pnpm@9.0.0) reads the pins below from
# package.json pnpm.overrides and ignores this copy; pnpm >=10 run directly
# (an IDE, CI image, or delegation disabled) reads ONLY this copy and silently
# skips package.json — leaving both would mean the security pins apply to some
# runners and not others. The two lists must stay identical;
# test/template-parity.test.mjs fails when they drift.
overrides:
  '@babel/core': ^7.29.6
  '@hono/node-server': ^2.0.5
  'body-parser': ^2.3.0
  'brace-expansion@1': ^1.1.18
  'brace-expansion@>=4': ^5.0.9
  'deepmerge-ts': ^8.0.0
  'handlebars': ^4.7.10
  'proxy-addr': ^2.0.8
  'source-map-js': ^1.2.2
  'next': ^16.3.8
  'devalue': ^5.9.2
  'dompurify': ^3.4.16
  'esbuild': ^0.28.1
  'fast-uri': ^3.1.6
  'fast-xml-builder': ^1.1.7
  'form-data': ^4.0.6
  'icu-minify': ^4.9.2
  'js-yaml@3': ^3.15.2
  'js-yaml@4': ^4.3.2
  'lodash': ^4.18.1
  'multer': ^2.3.0
  'nanoid': ^3.3.17
  'next-intl': ^4.9.2
  'nodemailer': ^10.0.9
  'postcss': ^8.5.18
  'qs': ^6.16.0
  'sharp': ^0.35.5
  'svgo': ^4.1.0
  'undici': ^7.29.1
  'uuid': ^11.1.1
  'yaml@>=2.0.0 <2.8.3': ^2.8.3
  'smol-toml': ^1.9.0
  'hono': ^4.13.5
  'postcss-selector-parser@6': ^7.1.6

auditConfig:
  ignoreGhsas:
    - GHSA-ch52-4w7c-c8xp

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - argon2
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
