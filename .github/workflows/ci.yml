name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    # Service containers for the API e2e suite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kast
          POSTGRES_PASSWORD: kast
          POSTGRES_DB: kast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kast -d kast_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kast:kast@localhost:5432/kast_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --prod --audit-level=moderate

      - name: Generate Prisma client
        run: pnpm --filter @kast-cms/api exec prisma generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply database migrations (e2e)
        run: pnpm --filter @kast-cms/api exec prisma migrate deploy

      - name: API e2e tests
        run: pnpm --filter @kast-cms/api run test:e2e

      - name: Build CLI
        run: pnpm --filter create-kast-app build

      - name: CLI e2e
        run: pnpm --filter create-kast-app test:e2e

      - name: Docker image smoke test
        env:
          # The e2e suite seeds admin@kast.local with the publicly documented
          # password into kast_test, and the API refuses to boot while that login
          # is live. Give the smoke test its own empty database so the container
          # applies the migrations itself and starts the way a deployment does,
          # instead of waiving the guard with SEED_DEV_ACCOUNTS.
          SMOKE_DATABASE_URL: postgresql://kast:kast@127.0.0.1:5432/kast_smoke?schema=public
        run: |
          set -euo pipefail
          trap 'docker rm -f kast-api-smoke kast-admin-smoke >/dev/null 2>&1 || true' EXIT
          docker run --rm --network host postgres:16 \
            psql postgresql://kast:kast@127.0.0.1:5432/kast_test \
            -c 'CREATE DATABASE kast_smoke'
          docker build -f apps/api/Dockerfile -t kast-api-smoke .
          docker run -d --name kast-api-smoke --network host \
            -e NODE_ENV=test \
            -e DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=6379 \
            -e JWT_SECRET="$JWT_SECRET" \
            kast-api-smoke
          for attempt in {1..60}; do
            curl -fsS http://127.0.0.1:3000/api/v1/health && break
            if [ "$attempt" = 60 ]; then docker logs kast-api-smoke; exit 1; fi
            sleep 2
          done
          docker build -f apps/admin/Dockerfile -t kast-admin-smoke .
          docker run -d --name kast-admin-smoke --network host kast-admin-smoke
          for attempt in {1..60}; do
            curl -fsS http://127.0.0.1:3001/admin/login >/dev/null && break
            if [ "$attempt" = 60 ]; then docker logs kast-admin-smoke; exit 1; fi
            sleep 2
          done
