name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Service containers for the API e2e suite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kast
          POSTGRES_PASSWORD: kast
          POSTGRES_DB: kast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kast -d kast_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kast:kast@localhost:5432/kast_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Generate Prisma client
        run: pnpm --filter @kast-cms/api exec prisma generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply database migrations (e2e)
        run: pnpm --filter @kast-cms/api exec prisma migrate deploy

      - name: API e2e tests
        run: pnpm --filter @kast-cms/api run test:e2e

      - name: Build CLI
        run: pnpm --filter create-kast-app build

      - name: CLI e2e
        run: pnpm --filter create-kast-app test:e2e
