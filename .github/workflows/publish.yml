name: Publish (edge)

# Builds :edge GHCR images on every push to main.
#
# All versioned publishing now lives in release.yml, which owns:
#   - npm publishing of create-kast-app + @kast-cms/sdk + @kast-cms/plugin-sdk
#     (independent per-package semantic versioning via multi-semantic-release),
#   - the product vX.Y.Z tag + GitHub Release,
#   - the versioned (:x.y.z + :latest) api/admin Docker images.
#
# Keeping :edge here (and nothing else) means there is exactly ONE place that
# does each publish, so nothing double-publishes. This workflow is intentionally
# NOT tag-triggered anymore.

on:
  push:
    branches:
      - main # builds :edge images on every merge to main

concurrency:
  group: publish-edge-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # ── Build & push :edge Docker images ───────────────────────────────────────
  publish-edge:
    name: Docker edge — ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # needed to push to GHCR
    strategy:
      matrix:
        include:
          - app: api
            image: ghcr.io/kast-cms/kast-api
            dockerfile: apps/api/Dockerfile
          - app: admin
            image: ghcr.io/kast-cms/kast-admin
            dockerfile: apps/admin/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=edge,branch=main

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
